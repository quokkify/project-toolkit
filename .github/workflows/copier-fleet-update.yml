name: Audit Copier-managed repositories

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      repository:
        description: Optional owner/repository to audit instead of the whole organization.
        type: string
        required: false
      template-ref:
        description: Optional project-toolkit ref; empty uses the latest released tag.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: copier-fleet-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Discover and audit Copier consumers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out project-toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python and Copier
        uses: ./actions/setup-python
        with:
          python-version: "3.14"
          package-manager: pip
          cache-dependencies: "false"
          install-command: python -m pip install copier==9.17.1

      - name: Audit Copier fleet
        env:
          REQUESTED_REPOSITORY: ${{ inputs.repository }}
          TEMPLATE_REF: ${{ inputs.template-ref }}
        run: |
          set -euo pipefail
          args=(
            --org quokkify
            --dry-run
            --public-only
            --exclude quokkify/.github
            --exclude quokkify/project-toolkit
          )
          if [[ -n "$REQUESTED_REPOSITORY" ]]; then
            args+=(--repo "$REQUESTED_REPOSITORY")
          fi
          if [[ -n "$TEMPLATE_REF" ]]; then
            args+=(--template-ref "$TEMPLATE_REF")
          fi
          output="$RUNNER_TEMP/copier-fleet-audit.txt"
          markdown_report="$RUNNER_TEMP/copier-fleet-audit.md"
          json_report="$RUNNER_TEMP/copier-fleet-audit.json"
          args+=(--markdown-report "$markdown_report" --json-report "$json_report")
          set +e
          python scripts/update_copier_fleet.py "${args[@]}" 2>&1 | tee "$output"
          status=${PIPESTATUS[0]}
          set -e
          cat "$markdown_report" >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
        id: audit

      - name: Upload Copier fleet audit report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copier-fleet-audit
          path: ${{ runner.temp }}/copier-fleet-audit.json
          if-no-files-found: warn
