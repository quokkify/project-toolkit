name: Update Copier-managed repositories

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run only or create/update pull requests.
        type: choice
        options:
          - dry-run
          - write
        default: dry-run
      repository:
        description: Optional owner/repository to process instead of the whole organization.
        type: string
        required: false
      template-ref:
        description: Optional project-toolkit ref; empty uses the latest released tag.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: copier-fleet-update
  cancel-in-progress: false

jobs:
  update:
    name: Discover and update Copier consumers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COPIER_FLEET_TOKEN: ${{ secrets.COPIER_FLEET_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out project-toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned Copier
        run: python -m pip install copier==9.17.0

      - name: Configure GitHub credentials
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" || "$REQUESTED_MODE" == "write" ]]; then
            if [[ -z "$COPIER_FLEET_TOKEN" ]]; then
              echo "::error::COPIER_FLEET_TOKEN is required for cross-repository writes."
              exit 2
            fi
            export GH_TOKEN="$COPIER_FLEET_TOKEN"
          else
            export GH_TOKEN="$GITHUB_TOKEN"
          fi
          gh auth setup-git

      - name: Run Copier fleet update
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_REPOSITORY: ${{ inputs.repository }}
          TEMPLATE_REF: ${{ inputs.template-ref }}
        run: |
          set -euo pipefail
          args=(--org quokkify)
          if [[ "$EVENT_NAME" == "schedule" || "$REQUESTED_MODE" == "write" ]]; then
            args+=(--write)
          else
            args+=(--dry-run)
          fi
          if [[ -n "$REQUESTED_REPOSITORY" ]]; then
            args+=(--repo "$REQUESTED_REPOSITORY")
          fi
          if [[ -n "$TEMPLATE_REF" ]]; then
            args+=(--template-ref "$TEMPLATE_REF")
          fi
          python scripts/update_copier_fleet.py "${args[@]}"
