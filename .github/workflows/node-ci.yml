name: Node.js CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Project directory relative to the repository root.
        type: string
        default: .
      node-version:
        description: Node.js version accepted by actions/setup-node.
        type: string
        default: "22"
      package-manager:
        description: One of auto, npm, pnpm, or yarn.
        type: string
        default: auto
      install-command:
        description: Optional trusted shell command overriding dependency installation.
        type: string
        default: ""
      lint-command:
        description: Trusted lint command.
        type: string
        default: "npm run lint"
      test-command:
        description: Trusted test command.
        type: string
        default: "npm test"
      build-command:
        description: Optional trusted build command.
        type: string
        default: "npm run build"
      run-lint:
        type: boolean
        default: true
      run-tests:
        type: boolean
        default: true
      run-build:
        description: Disabled by default because not every Node.js project has a build.
        type: boolean
        default: false
      cache-dependencies:
        type: boolean
        default: true
      timeout-minutes:
        type: number
        default: 20
      upload-test-artifacts:
        description: Upload test artifacts. Disabled unless explicitly enabled.
        type: boolean
        default: false
      test-artifact-path:
        description: Path or glob to upload when upload-test-artifacts is enabled.
        type: string
        default: test-results
      test-artifact-name:
        description: Artifact name used when upload-test-artifacts is enabled.
        type: string
        default: node-test-artifacts

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Cache Node.js dependencies
        if: ${{ inputs.cache-dependencies }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ~/.cache/yarn
            ~/.local/share/pnpm/store
          key: node-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles(format('{0}/**/package-lock.json', inputs.working-directory), format('{0}/**/npm-shrinkwrap.json', inputs.working-directory), format('{0}/**/pnpm-lock.yaml', inputs.working-directory), format('{0}/**/yarn.lock', inputs.working-directory)) }}
          restore-keys: |
            node-${{ runner.os }}-${{ inputs.node-version }}-
      - name: Install dependencies
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          if [[ -n "$INSTALL_COMMAND" ]]; then bash -euo pipefail -c "$INSTALL_COMMAND"; exit; fi
          manager="$PACKAGE_MANAGER"
          if [[ "$manager" == auto ]]; then
            if [[ -f pnpm-lock.yaml ]]; then manager=pnpm
            elif [[ -f yarn.lock ]]; then manager=yarn
            else manager=npm
            fi
          fi
          case "$manager" in
            npm)
              if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
                npm ci
              else
                npm install
              fi
              ;;
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            yarn) corepack enable && yarn install --immutable ;;
            *) echo "Unsupported package-manager: $manager" >&2; exit 2 ;;
          esac
      - name: Lint
        if: ${{ inputs.run-lint }}
        env:
          COMMAND: ${{ inputs.lint-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Test
        if: ${{ inputs.run-tests }}
        env:
          COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Build
        if: ${{ inputs.run-build && inputs.build-command != '' }}
        env:
          COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$COMMAND"
      - name: Upload test artifacts
        if: ${{ always() && inputs.upload-test-artifacts }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.test-artifact-name }}
          path: ${{ format('{0}/{1}', inputs.working-directory, inputs.test-artifact-path) }}
          if-no-files-found: warn
