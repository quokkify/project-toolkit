name: Release Please

on:
  workflow_call:
    inputs:
      mode:
        description: "single for one package/version; manifest for independently versioned components."
        type: string
        default: single
      release-type:
        description: Release Please release type for single mode.
        type: string
        default: simple
      path:
        description: Package path for single mode.
        type: string
        default: .
      config-file:
        description: Release Please manifest-mode config path.
        type: string
        default: .github/release-please/config.json
      manifest-file:
        description: Release Please manifest path.
        type: string
        default: .github/release-please/manifest.json
      config-backed-single:
        description: Use root config/manifest for generated single-package consumers.
        type: boolean
        default: false
      target-branch:
        description: Branch Release Please should target; empty uses repository default.
        type: string
        default: ""
      enrich-release-notes:
        description: Enrich the generated release PR from its optional PR-body sections.
        type: boolean
        default: false
      enrichment-script:
        description: Repository-relative enrichment script path.
        type: string
        default: scripts/enrich_release_notes.py
    outputs:
      releases-created:
        description: "true when this run tagged a release; empty or false otherwise."
        value: ${{ jobs.single.outputs.releases-created || jobs.manifest.outputs.releases-created }}
      tag-name:
        description: Tag Release Please created, empty when no release was cut.
        value: ${{ jobs.single.outputs.tag-name || jobs.manifest.outputs.tag-name }}

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate mode
        env:
          MODE: ${{ inputs.mode }}
        run: '[[ "$MODE" == single || "$MODE" == manifest ]] || { echo "mode must be single or manifest" >&2; exit 2; }'

  single:
    if: ${{ inputs.mode == 'single' }}
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      releases-created: ${{ steps.release.outputs.releases_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Release Please for one package
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: ${{ inputs.config-backed-single && '' || inputs.release-type }}
          path: ${{ inputs.config-backed-single && '' || inputs.path }}
          config-file: ${{ inputs.config-backed-single && inputs.config-file || '' }}
          manifest-file: ${{ inputs.config-backed-single && inputs.manifest-file || '' }}
          target-branch: ${{ inputs.target-branch }}
      - name: Enrich release PR
        if: ${{ inputs.enrich-release-notes && steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
          ENRICHMENT_SCRIPT: ${{ inputs.enrichment-script }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, subprocess
          prs = json.loads(os.environ["RELEASE_PRS"])
          if len(prs) != 1:
              raise SystemExit(f"expected exactly one release PR, got {len(prs)}")
          number = str(prs[0]["number"])
          details = json.loads(subprocess.check_output(["gh", "pr", "view", number, "--json", "headRepository,baseRepository"], text=True))
          repo = os.environ["REPOSITORY"]
          if any(details[key]["nameWithOwner"] != repo for key in ("headRepository", "baseRepository")):
              raise SystemExit("release PR repository validation failed")
          subprocess.run(["gh", "pr", "checkout", number, "--force"], check=True)
          lines = open("CHANGELOG.md", encoding="utf-8").read().splitlines()
          in_top = False
          fence = None
          in_rich_block = False
          source_numbers = []
          for line in lines:
              if "<!-- project-toolkit:rich-block:start -->" in line:
                  in_rich_block = True
                  continue
              if "<!-- project-toolkit:rich-block:end -->" in line:
                  in_rich_block = False
                  continue
              fence_match = re.match(r"^\s*(`{3,}|~{3,})", line)
              if fence_match:
                  token = fence_match.group(1)
                  if fence is None:
                      fence = (token[0], len(token))
                  elif token[0] == fence[0] and len(token) >= fence[1]:
                      fence = None
              elif not in_rich_block and fence is None and line.startswith("## "):
                  if in_top:
                      break
                  in_top = True
              elif in_top and not in_rich_block and fence is None:
                  source_numbers.extend(
                      number
                      for match in re.findall(r"(?:\(#(\d+)\)|\[#(\d+)\]\([^)]*\))", line)
                      for number in match
                      if number
                  )
          selected = []
          for source_number in sorted(set(source_numbers), key=int):
              source = json.loads(subprocess.check_output(["gh", "pr", "view", source_number, "--json", "body,title,number,state,mergedAt,headRepository,baseRepository"], text=True))
              if source["state"] != "MERGED" or not source.get("mergedAt"):
                  raise SystemExit(f"source PR {source_number} is not merged")
              if any(source[key]["nameWithOwner"] != repo for key in ("headRepository", "baseRepository")):
                  raise SystemExit(f"source PR {source_number} repository validation failed")
              selected.append(source)
          json.dump(selected, open("/tmp/release-prs.json", "w", encoding="utf-8"))
          open("/tmp/release-pr-number", "w", encoding="utf-8").write(number)
          PY
          gh pr view "$(cat /tmp/release-pr-number)" --json body --jq .body > /tmp/release-body.md
          python "${ENRICHMENT_SCRIPT}" --changelog CHANGELOG.md --pull-requests /tmp/release-prs.json --release-body /tmp/release-body.md --rich-body /tmp/rich-body.md
          if ! git diff --quiet -- CHANGELOG.md; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add CHANGELOG.md
            git commit -m "chore(release): enrich release notes"
            git push origin HEAD
          fi
          gh pr view "$(cat /tmp/release-pr-number)" --json body --jq .body > /tmp/release-body.md
          gh api -X PATCH "repos/${REPOSITORY}/pulls/$(cat /tmp/release-pr-number)" --input <(python -c 'import json; print(json.dumps({"body":open("/tmp/rich-body.md").read()}))')

  manifest:
    if: ${{ inputs.mode == 'manifest' }}
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      releases-created: ${{ steps.release.outputs.releases_created }}
      tag-name: ${{ steps.release.outputs.tag_name || steps.release.outputs['.--tag_name'] }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Release Please in manifest mode
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          target-branch: ${{ inputs.target-branch }}
      - name: Enrich release PR
        if: ${{ inputs.enrich-release-notes && steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
          ENRICHMENT_SCRIPT: ${{ inputs.enrichment-script }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, subprocess
          prs = json.loads(os.environ["RELEASE_PRS"])
          if len(prs) != 1:
              raise SystemExit(f"expected exactly one release PR, got {len(prs)}")
          number = str(prs[0]["number"])
          details = json.loads(subprocess.check_output(["gh", "pr", "view", number, "--json", "headRepository,baseRepository"], text=True))
          repo = os.environ["REPOSITORY"]
          if any(details[key]["nameWithOwner"] != repo for key in ("headRepository", "baseRepository")):
              raise SystemExit("release PR repository validation failed")
          subprocess.run(["gh", "pr", "checkout", number, "--force"], check=True)
          lines = open("CHANGELOG.md", encoding="utf-8").read().splitlines()
          in_top = False
          fence = None
          in_rich_block = False
          source_numbers = []
          for line in lines:
              if "<!-- project-toolkit:rich-block:start -->" in line:
                  in_rich_block = True
                  continue
              if "<!-- project-toolkit:rich-block:end -->" in line:
                  in_rich_block = False
                  continue
              fence_match = re.match(r"^\s*(`{3,}|~{3,})", line)
              if fence_match:
                  token = fence_match.group(1)
                  if fence is None:
                      fence = (token[0], len(token))
                  elif token[0] == fence[0] and len(token) >= fence[1]:
                      fence = None
              elif not in_rich_block and fence is None and line.startswith("## "):
                  if in_top:
                      break
                  in_top = True
              elif in_top and not in_rich_block and fence is None:
                  source_numbers.extend(
                      number
                      for match in re.findall(r"(?:\(#(\d+)\)|\[#(\d+)\]\([^)]*\))", line)
                      for number in match
                      if number
                  )
          selected = []
          for source_number in sorted(set(source_numbers), key=int):
              source = json.loads(subprocess.check_output(["gh", "pr", "view", source_number, "--json", "body,title,number,state,mergedAt,headRepository,baseRepository"], text=True))
              if source["state"] != "MERGED" or not source.get("mergedAt"):
                  raise SystemExit(f"source PR {source_number} is not merged")
              if any(source[key]["nameWithOwner"] != repo for key in ("headRepository", "baseRepository")):
                  raise SystemExit(f"source PR {source_number} repository validation failed")
              selected.append(source)
          json.dump(selected, open("/tmp/release-prs.json", "w", encoding="utf-8"))
          open("/tmp/release-pr-number", "w", encoding="utf-8").write(number)
          PY
          gh pr view "$(cat /tmp/release-pr-number)" --json body --jq .body > /tmp/release-body.md
          python "${ENRICHMENT_SCRIPT}" --changelog CHANGELOG.md --pull-requests /tmp/release-prs.json --release-body /tmp/release-body.md --rich-body /tmp/rich-body.md
          if ! git diff --quiet -- CHANGELOG.md; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add CHANGELOG.md
            git commit -m "chore(release): enrich release notes"
            git push origin HEAD
          fi
          gh pr view "$(cat /tmp/release-pr-number)" --json body --jq .body > /tmp/release-body.md
          gh api -X PATCH "repos/${REPOSITORY}/pulls/$(cat /tmp/release-pr-number)" --input <(python -c 'import json; print(json.dumps({"body":open("/tmp/rich-body.md").read()}))')
