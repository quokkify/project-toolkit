name: Validate toolkit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.11.1"
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned validation dependencies
        run: python -m pip install PyYAML==6.0.2 copier==9.10.2
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          install -m 0755 actionlint "$HOME/.local/bin/actionlint"
      - name: Run repository validation
        run: python scripts/validate.py
      - name: Validate Renovate preset
        run: npx --yes --package renovate@44.4.6 renovate-config-validator --strict renovate/default.json5
      - name: Run actionlint on toolkit and examples
        run: actionlint .github/workflows/*.yml examples/*.yml
      - name: Check shell snippets
        run: |
          if find . -type f -name '*.sh' -print -quit | grep -q .; then
            shellcheck $(find . -type f -name '*.sh' -print)
          else
            echo "No shell scripts present; shellcheck not applicable"
          fi
      - name: Check diff whitespace
        run: git diff --check
