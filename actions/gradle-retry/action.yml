name: Gradle command with bounded retry
description: Run a Gradle command, retrying transient 429s and refreshing dependencies once after a repository not-found failure.

inputs:
  command:
    description: Trusted Gradle command to execute.
    required: true
  max-attempts:
    description: Maximum attempts for transient HTTP 429 failures.
    required: false
    default: "3"
  initial-delay-seconds:
    description: Initial delay before a transient HTTP 429 retry.
    required: false
    default: "30"

runs:
  using: composite
  steps:
    - name: Run Gradle command with bounded recovery
      shell: bash
      env:
        GRADLE_RETRY_COMMAND: ${{ inputs.command }}
        GRADLE_RETRY_MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        GRADLE_RETRY_INITIAL_DELAY_SECONDS: ${{ inputs.initial-delay-seconds }}
      run: "${GITHUB_ACTION_PATH}/gradle-retry.sh"
