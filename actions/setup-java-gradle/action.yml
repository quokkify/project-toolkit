name: Setup Java + Gradle wrapper
description: Prepare Java and Java/Gradle cache entries.

inputs:
  java-version:
    description: Java version accepted by actions/setup-java.
    required: false
    default: "21"
  distribution:
    description: JDK distribution accepted by actions/setup-java.
    required: false
    default: temurin
  working-directory:
    description: Repository subpath where Gradle build files are located.
    required: false
    default: .
  cache-dependencies:
    description: Cache Java and Gradle local caches.
    required: false
    default: "true"
  validate-wrappers:
    description: Validate repository-contained Gradle Wrapper JAR files before setup.
    required: false
    default: "true"

outputs:
  gradle-command:
    description: Workspace-relative Gradle command to use in downstream steps.
    value: ${{ steps.resolve.outputs.gradle-command }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        CACHE_DEPENDENCIES: ${{ inputs.cache-dependencies }}
        VALIDATE_WRAPPERS: ${{ inputs.validate-wrappers }}
      run: |
        set -euo pipefail
        if [[ "$CACHE_DEPENDENCIES" != "true" && "$CACHE_DEPENDENCIES" != "false" ]]; then
          echo "cache-dependencies must be 'true' or 'false': $CACHE_DEPENDENCIES" >&2
          exit 2
        fi
        if [[ "$VALIDATE_WRAPPERS" != "true" && "$VALIDATE_WRAPPERS" != "false" ]]; then
          echo "validate-wrappers must be 'true' or 'false': $VALIDATE_WRAPPERS" >&2
          exit 2
        fi
    - name: Validate Gradle wrappers
      if: ${{ inputs.validate-wrappers == 'true' }}
      uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
    - name: Set up Java
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
    - name: Cache Gradle dependencies
      if: ${{ inputs.cache-dependencies == 'true' }}
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ inputs.java-version }}-${{ hashFiles(format('{0}/**/gradle-wrapper.properties', inputs.working-directory), format('{0}/**/*.gradle*', inputs.working-directory)) }}
        restore-keys: |
          gradle-${{ runner.os }}-${{ inputs.java-version }}-
    - name: Resolve Gradle wrapper command
      id: resolve
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        wrapper="$WORKING_DIRECTORY/gradlew"
        if [[ -f "$wrapper" ]]; then
          chmod +x "$wrapper"
          echo "gradle-command=$wrapper" >> "$GITHUB_OUTPUT"
        else
          echo "gradle-command=gradle" >> "$GITHUB_OUTPUT"
        fi
