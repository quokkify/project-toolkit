name: Setup Java + Gradle wrapper
description: Prepare Java and Java/Gradle cache entries.

inputs:
  java-version:
    description: Java version accepted by actions/setup-java.
    required: false
    default: "21"
  distribution:
    description: JDK distribution accepted by actions/setup-java.
    required: false
    default: temurin
  working-directory:
    description: Repository subpath where Gradle build files are located.
    required: false
    default: .
  cache-dependencies:
    description: Cache Java and Gradle local caches.
    required: false
    default: "true"

outputs:
  gradle-command:
    description: Preferred Gradle command to use in downstream steps.
    value: ${{ steps.resolve.outputs.gradle-command }}

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}
    - name: Cache Java dependencies
      if: ${{ inputs.cache-dependencies == 'true' }}
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.m2/repository
        key: java-${{ runner.os }}-${{ inputs.java-version }}-${{ hashFiles(format('{0}/**/gradle-wrapper.properties', inputs.working-directory), format('{0}/**/*.gradle*', inputs.working-directory), format('{0}/**/pom.xml', inputs.working-directory)) }}
        restore-keys: |
          java-${{ runner.os }}-${{ inputs.java-version }}-
    - name: Resolve Gradle wrapper command
      id: resolve
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if [[ -f "$WORKING_DIRECTORY/gradlew" ]]; then
          chmod +x "$WORKING_DIRECTORY/gradlew"
          echo "gradle-command=./gradlew" >> "$GITHUB_OUTPUT"
        else
          echo "gradle-command=gradle" >> "$GITHUB_OUTPUT"
        fi
    - name: Validate boolean inputs
      shell: bash
      env:
        CACHE_DEPENDENCIES: ${{ inputs.cache-dependencies }}
      run: |
        set -euo pipefail
        if [[ "$CACHE_DEPENDENCIES" != "true" && "$CACHE_DEPENDENCIES" != "false" ]]; then
          echo "cache-dependencies must be 'true' or 'false': $CACHE_DEPENDENCIES" >&2
          exit 2
        fi