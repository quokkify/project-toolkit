name: Setup Python
description: Prepare Python with cached dependencies and optional dependency installation.

inputs:
  python-version:
    description: Python version accepted by actions/setup-python.
    required: false
    default: "3.12"
  working-directory:
    description: Repository subpath where project files are located.
    required: false
    default: .
  package-manager:
    description: One of auto, pip, uv, or poetry.
    required: false
    default: auto
  requirements-file:
    description: Requirements file relative to working-directory; auto-detected when empty.
    required: false
    default: ""
  uv-version:
    description: Exact uv package version installed when uv is selected.
    required: false
    default: "0.8.15"
  poetry-version:
    description: Exact Poetry package version installed when Poetry is selected.
    required: false
    default: "2.1.4"
  install-command:
    description: Optional trusted shell command that replaces default dependency installation.
    required: false
    default: ""
  install-dependencies:
    description: Install dependencies after setting up Python.
    required: false
    default: "true"
  cache-dependencies:
    description: Cache pip/uv/poetry package metadata.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        CACHE_DEPENDENCIES: ${{ inputs.cache-dependencies }}
        INSTALL_DEPENDENCIES: ${{ inputs.install-dependencies }}
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        POETRY_VERSION: ${{ inputs.poetry-version }}
        UV_VERSION: ${{ inputs.uv-version }}
      run: |
        set -euo pipefail
        for input in "cache-dependencies=$CACHE_DEPENDENCIES" "install-dependencies=$INSTALL_DEPENDENCIES"; do
          name=${input%%=*}
          value=${input#*=}
          if [[ "$value" != "true" && "$value" != "false" ]]; then
            echo "$name must be 'true' or 'false': $value" >&2
            exit 2
          fi
        done
        case "$PACKAGE_MANAGER" in
          auto|pip|uv|poetry) ;;
          *) echo "Unsupported package-manager: $PACKAGE_MANAGER" >&2; exit 2 ;;
        esac
        if [[ -z "$UV_VERSION" || -z "$POETRY_VERSION" ]]; then
          echo "uv-version and poetry-version must be exact non-empty versions" >&2
          exit 2
        fi
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Cache Python dependencies
      if: ${{ inputs.cache-dependencies == 'true' }}
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: |
          ~/.cache/pip
          ~/.cache/uv
          ~/.cache/pypoetry
        key: python-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles(format('{0}/**/uv.lock', inputs.working-directory), format('{0}/**/poetry.lock', inputs.working-directory), format('{0}/**/requirements*.txt', inputs.working-directory), format('{0}/**/pyproject.toml', inputs.working-directory)) }}
        restore-keys: |
          python-${{ runner.os }}-${{ inputs.python-version }}-
    - name: Install Python dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash
      env:
        INSTALL_COMMAND: ${{ inputs.install-command }}
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        POETRY_VERSION: ${{ inputs.poetry-version }}
        REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        UV_VERSION: ${{ inputs.uv-version }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        cd "$WORKING_DIRECTORY"

        if [[ -n "$INSTALL_COMMAND" ]]; then
          bash -euo pipefail -c "$INSTALL_COMMAND"
          exit 0
        fi

        manager="$PACKAGE_MANAGER"
        if [[ "$manager" == "auto" ]]; then
          if [[ -f uv.lock ]]; then
            manager=uv
          elif [[ -f poetry.lock ]]; then
            manager=poetry
          else
            manager=pip
          fi
        fi

        case "$manager" in
          uv)
            python -m pip install "uv==$UV_VERSION"
            uv sync --frozen
            ;;
          poetry)
            python -m pip install "poetry==$POETRY_VERSION"
            poetry install --no-interaction
            ;;
          pip)
            requirements="$REQUIREMENTS_FILE"
            if [[ -n "$requirements" && ! -f "$requirements" ]]; then
              echo "requirements-file does not exist: $requirements" >&2
              exit 2
            fi
            if [[ -z "$requirements" && -f requirements.txt ]]; then
              requirements=requirements.txt
            elif [[ -z "$requirements" ]]; then
              shopt -s nullglob
              candidates=(requirements*.txt)
              shopt -u nullglob
              if (( ${#candidates[@]} == 1 )); then
                requirements="${candidates[0]}"
              elif (( ${#candidates[@]} > 1 )); then
                echo "Multiple requirements files found; set requirements-file explicitly" >&2
                exit 2
              fi
            fi
            if [[ -n "$requirements" ]]; then
              python -m pip install -r "$requirements"
            elif [[ -f pyproject.toml ]]; then
              python -m pip install -e .
            else
              echo "No Python dependency manifest found; continuing without install"
            fi
            ;;
        esac
