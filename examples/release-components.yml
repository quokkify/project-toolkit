name: Component releases
# Requires the latest published immutable v2.3.0 toolkit tag.
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release:
    uses: quokkify/project-toolkit/.github/workflows/release-please.yml@v2.3.0
    with:
      mode: manifest
      config-file: .github/release-please/config.json
      manifest-file: .github/release-please/manifest.json
