name: Invalid release concurrency

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-global
  cancel-in-progress: true

jobs:
  release:
    uses: ./.github/workflows/release-please.yml
    with:
      mode: manifest
      config-file: .github/release-please/config.json
      manifest-file: .github/release-please/manifest.json
