name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-please.yml
    with:
      mode: manifest
      config-file: .github/release-please/config.json
      manifest-file: .github/release-please/manifest.json

  # Ungated: this would run the write-capable fleet updater on every push to main.
  fleet-update:
    needs: release
    uses: ./.github/workflows/copier-fleet-auto-update.yml
    with:
      template-ref: ${{ needs.release.outputs.tag-name }}
    secrets: inherit
